name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Typecheck & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webhook_delivery
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/webhook_delivery?schema=public
        run: npx prisma migrate deploy

      - name: Run Vitest Unit & Integration Test Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/webhook_delivery?schema=public
          REDIS_URL: redis://localhost:6381
          API_KEY_SALT: ci_secret_salt_12345
          ALLOW_LOCAL_WEBHOOKS: "true"
        run: npm test

      - name: Build Production Docker Image
        run: docker build -t webhook-delivery:ci .
